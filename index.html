<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo-Run · niklaskrahe.de</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f4f2; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: ui-monospace, Menlo, Consolas, monospace; color: #3a3a3a;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { width: min(100vw, 900px); }
  canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  .hint { font-size: 13px; opacity: .55; text-align: center; margin-top: 12px; padding: 0 12px; line-height: 1.5; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hint">
    Springen: Leertaste / ↑ · Ducken: ↓ · Ton an/aus: M<br>
    Handy: rechts tippen = springen · links gedrückt halten = ducken
  </div>
</div>
<script>
(() => {
  const W = 800, H = 240, GROUND = 205, P = 3;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  function resize() {
    const d = window.devicePixelRatio || 1;
    cv.width = W * d; cv.height = H * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.imageSmoothingEnabled = false;
  }
  resize();
  addEventListener('resize', resize);

  const BG = '#f4f4f2', DARK = '#3a3a3a', FAINT = '#d9d9d3';
  const COL = { '#': DARK, 'o': '#ff8a00', 'w': '#ffffff', 'g': '#c8c8c2', 'c': '#e4e4df' };

  function draw(rows, x, y, s = P) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        ctx.fillStyle = COL[ch];
        ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), s, s);
      }
    }
  }

  // ---------- Sprites ----------
  const TOP = [
    ".....o......",
    ".....#......",
    "..########..",
    "..#wwwwww#..",
    "..#wowwow#..",
    "..#wwwwww#..",
    "..########..",
    "....####....",
    ".##########.",
    ".#.######.#.",
    "...######...",
    "...######..."
  ];
  const TOP_DEAD = TOP.slice();
  TOP_DEAD[4] = "..#w#ww#w#..";
  TOP_DEAD[0] = "............";
  const RUN_A = TOP.concat(["...##..##...", "...#....##.."]);
  const RUN_B = TOP.concat(["...##..##...", "..##....#..."]);
  const STAND = TOP.concat(["...##..##...", "...##..##..."]);
  const DEAD  = TOP_DEAD.concat(["...##..##...", "...##..##..."]);

  const DUCK_TOP = [
    "...............o",
    "......########.#",
    "......#wwwwww###",
    "......#wowwow#..",
    ".#############..",
    ".############...",
    "..##########...."
  ];
  const DUCK_A = DUCK_TOP.concat(["..##.....##.....", "..#.......##...."]);
  const DUCK_B = DUCK_TOP.concat(["..##.....##.....", ".##.......#....."]);

  const CONE = [
    "...o...",
    "..ooo..",
    "..www..",
    "..ooo..",
    ".ooooo.",
    ".wwwww.",
    ".ooooo.",
    "ooooooo",
    "#######"
  ];
  const CRATE = [
    "#########",
    "##ggggg##",
    "#g#ggg#g#",
    "#gg#g#gg#",
    "#ggg#ggg#",
    "#gg#g#gg#",
    "#g#ggg#g#",
    "##ggggg##",
    "#########"
  ];
  const DRONE_A = [
    "###.....###",
    "..#.....#..",
    "..#######..",
    "..#wwoww#..",
    "...#####...",
    "....#.#...."
  ];
  const DRONE_B = [".#.......#."].concat(DRONE_A.slice(1));
  const CLOUD = [
    "....cccc......",
    "..cccccccc....",
    ".cccccccccccc.",
    "cccccccccccccc"
  ];

  // ---------- Sound ----------
  let ac = null, muted = false;
  function initAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function beep(f, d, type = 'square', vol = 0.04, slide) {
    if (!ac || muted) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + d + 0.02);
  }

  // ---------- Highscore ----------
  let hi = 0;
  try { hi = parseInt(localStorage.getItem('roborun-hi'), 10) || 0; } catch (e) {}
  function saveHi() { try { localStorage.setItem('roborun-hi', String(hi)); } catch (e) {} }

  // ---------- State ----------
  const G = 2600, JUMP_V = 830;
  let state = 'ready';   // ready | running | over
  let pl, obs, clouds, pebbles, speed, dist, score, spawnIn, bgOff, legT, legFlip, overAt, flashUntil, lastMilestone, time;
  let jumpQueuedAt = -1;
  const keys = { jump: false, duck: false };

  function reset() {
    pl = { x: 60, by: GROUND, vy: 0, onGround: true, duck: false };
    obs = [];
    clouds = [];
    for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: 20 + Math.random() * 60 });
    pebbles = [];
    for (let i = 0; i < 30; i++) pebbles.push({ x: Math.random() * W, y: GROUND + 5 + Math.random() * 18, w: 2 + Math.floor(Math.random() * 3) * 2 });
    speed = 380; dist = 0; score = 0; spawnIn = W * 0.55; bgOff = 0;
    legT = 0; legFlip = false; flashUntil = 0; lastMilestone = 0;
  }
  reset();
  time = 0;

  function start() {
    reset();
    state = 'running';
  }

  function press() {
    initAudio();
    if (state === 'ready') { start(); jumpQueuedAt = time; }
    else if (state === 'over') { if (time - overAt > 0.5) { start(); } }
    else jumpQueuedAt = time;
  }

  // ---------- Input ----------
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  const DUCK_KEYS = ['ArrowDown', 'KeyS'];
  addEventListener('keydown', e => {
    if (JUMP_KEYS.includes(e.code)) {
      e.preventDefault();
      if (!e.repeat) press();
      keys.jump = true;
    } else if (DUCK_KEYS.includes(e.code)) {
      e.preventDefault();
      keys.duck = true;
    } else if (e.code === 'KeyM') {
      muted = !muted;
    }
  });
  addEventListener('keyup', e => {
    if (JUMP_KEYS.includes(e.code)) keys.jump = false;
    if (DUCK_KEYS.includes(e.code)) keys.duck = false;
  });

  const touchRoles = new Map();
  addEventListener('touchstart', e => {
    e.preventDefault();
    initAudio();
    for (const t of e.changedTouches) {
      const leftSide = t.clientX < window.innerWidth * 0.4;
      if (leftSide && state === 'running') {
        touchRoles.set(t.identifier, 'duck'); keys.duck = true;
      } else {
        touchRoles.set(t.identifier, 'jump'); keys.jump = true; press();
      }
    }
  }, { passive: false });
  function endTouch(e) {
    for (const t of e.changedTouches) {
      const role = touchRoles.get(t.identifier);
      touchRoles.delete(t.identifier);
      if (role === 'duck') keys.duck = [...touchRoles.values()].includes('duck');
      if (role === 'jump') keys.jump = [...touchRoles.values()].includes('jump');
    }
  }
  addEventListener('touchend', endTouch);
  addEventListener('touchcancel', endTouch);
  cv.addEventListener('mousedown', () => { press(); keys.jump = true; });
  addEventListener('mouseup', () => { keys.jump = false; });

  // ---------- Obstacles ----------
  function spawn() {
    const r = Math.random();
    let o;
    if (score > 250 && r < 0.25) {
      const ys = [GROUND - 24, GROUND - 48, GROUND - 78];
      o = { t: 'drone', x: W + 20, y: ys[Math.floor(Math.random() * 3)], w: 33, h: 18 };
    } else if (r < 0.6) {
      const n = 1 + Math.floor(Math.random() * (score > 150 ? 3 : 2));
      o = { t: 'cone', n, s: 3, x: W + 20, w: n * 21, h: 27, y: GROUND - 27 };
    } else if (r < 0.8) {
      const n = (score > 300 && Math.random() < 0.4) ? 2 : 1;
      o = { t: 'cone', n, s: 4, x: W + 20, w: n * 28, h: 36, y: GROUND - 36 };
    } else {
      if (score > 500 && Math.random() < 0.35) {
        o = { t: 'crate', n: 1, stack: 2, x: W + 20, w: 36, h: 72, y: GROUND - 72 };
      } else {
        const n = (score > 200 && Math.random() < 0.5) ? 2 : 1;
        o = { t: 'crate', n, stack: 1, x: W + 20, w: n * 36, h: 36, y: GROUND - 36 };
      }
    }
    obs.push(o);
    spawnIn = o.w + speed * (0.62 + Math.random() * 0.75);
  }

  function obstacleBox(o) {
    if (o.t === 'cone') return { x: o.x + 4, y: o.y + 4, w: o.w - 8, h: o.h - 4 };
    if (o.t === 'drone') return { x: o.x + 4, y: o.y + 2, w: o.w - 8, h: o.h - 4 };
    return { x: o.x + 2, y: o.y + 2, w: o.w - 4, h: o.h - 2 };
  }
  function playerBox() {
    if (pl.duck) return { x: pl.x + 4, y: pl.by - 24, w: 40, h: 22 };
    return { x: pl.x + 7, y: pl.by - 36, w: 22, h: 34 };
  }
  function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    if (state !== 'running') return;

    speed = Math.min(950, 380 + score * 0.5);

    // jump (with small input buffer)
    if (jumpQueuedAt >= 0 && time - jumpQueuedAt < 0.12 && pl.onGround && !keys.duck) {
      pl.vy = -JUMP_V; pl.onGround = false; jumpQueuedAt = -1;
      beep(520, 0.1, 'square', 0.035, 880);
    }
    if (time - jumpQueuedAt >= 0.12) jumpQueuedAt = -1;

    const fastFall = keys.duck && !pl.onGround;
    pl.vy += G * dt * (fastFall ? 3 : 1);
    if (!pl.onGround && !keys.jump && pl.vy < -380) pl.vy = -380; // short hop when released early
    pl.by += pl.vy * dt;
    if (pl.by >= GROUND) { pl.by = GROUND; pl.vy = 0; pl.onGround = true; }
    pl.duck = keys.duck && pl.onGround;

    legT += dt;
    if (legT > 0.09) { legT = 0; legFlip = !legFlip; }

    const dx = speed * dt;
    dist += dx;
    score = Math.floor(dist / 25);
    const m = Math.floor(score / 100);
    if (m > lastMilestone) {
      lastMilestone = m; flashUntil = time + 1;
      beep(880, 0.07, 'square', 0.03);
      setTimeout(() => beep(1320, 0.12, 'square', 0.03), 80);
    }

    bgOff += dx * 0.15;
    for (const c of clouds) {
      c.x -= dx * 0.06;
      if (c.x < -60) { c.x = W + Math.random() * 200; c.y = 20 + Math.random() * 60; }
    }
    for (const p of pebbles) {
      p.x -= dx;
      if (p.x < -10) { p.x = W + Math.random() * 40; p.y = GROUND + 5 + Math.random() * 18; }
    }

    spawnIn -= dx;
    if (spawnIn <= 0) spawn();

    const pb = playerBox();
    for (const o of obs) {
      o.x -= dx + (o.t === 'drone' ? 40 * dt : 0);
      if (hit(pb, obstacleBox(o))) { gameOver(); break; }
    }
    obs = obs.filter(o => o.x + o.w > -20);
  }

  function gameOver() {
    state = 'over'; overAt = time;
    beep(240, 0.4, 'sawtooth', 0.05, 70);
    if (score > hi) { hi = score; saveHi(); }
  }

  // ---------- Render ----------
  function pylon(x) {
    const top = GROUND - 125;
    ctx.beginPath();
    ctx.moveTo(x - 15, GROUND); ctx.lineTo(x - 3, top); ctx.lineTo(x + 3, top); ctx.lineTo(x + 15, GROUND);
    const segs = 4, segH = 125 / segs;
    for (let i = 0; i < segs; i++) {
      const y1 = GROUND - i * segH, y2 = GROUND - (i + 1) * segH;
      const w1 = 15 - 12 * (i / segs), w2 = 15 - 12 * ((i + 1) / segs);
      ctx.moveTo(x - w1, y1); ctx.lineTo(x + w2, y2);
      ctx.moveTo(x + w1, y1); ctx.lineTo(x - w2, y2);
    }
    ctx.moveTo(x - 30, top + 18); ctx.lineTo(x + 30, top + 18);
    ctx.moveTo(x - 22, top + 42); ctx.lineTo(x + 22, top + 42);
    ctx.stroke();
  }
  function wires(x1, x2) {
    const top = GROUND - 125;
    ctx.beginPath();
    for (const [dy, arm] of [[18, 30], [42, 22]]) {
      for (const side of [-1, 1]) {
        const ax = x1 + side * arm, bx = x2 + side * arm, y = top + dy;
        ctx.moveTo(ax, y);
        ctx.quadraticCurveTo((ax + bx) / 2, y + 22, bx, y);
      }
    }
    ctx.stroke();
  }

  const pad = n => String(n).padStart(5, '0');

  function render() {
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);

    // background power lines
    ctx.strokeStyle = FAINT; ctx.lineWidth = 1.5;
    const SP = 320, off = bgOff % SP;
    const xs = [];
    for (let k = -1; k <= Math.ceil(W / SP) + 1; k++) xs.push(k * SP - off + 160);
    for (let i = 0; i < xs.length - 1; i++) wires(xs[i], xs[i + 1]);
    ctx.lineWidth = 2;
    for (const x of xs) pylon(x);

    for (const c of clouds) draw(CLOUD, c.x, c.y, 3);

    // ground
    ctx.fillStyle = DARK; ctx.fillRect(0, GROUND - 1, W, 2);
    ctx.fillStyle = '#9a9a94';
    for (const p of pebbles) ctx.fillRect(Math.round(p.x), Math.round(p.y), p.w, 2);

    // obstacles
    for (const o of obs) {
      if (o.t === 'cone') {
        for (let i = 0; i < o.n; i++) draw(CONE, o.x + i * 7 * o.s, o.y, o.s);
      } else if (o.t === 'crate') {
        for (let i = 0; i < o.n; i++) for (let j = 0; j < o.stack; j++) draw(CRATE, o.x + i * 36, GROUND - 36 * (j + 1), 4);
      } else {
        draw(Math.floor(time * 12) % 2 ? DRONE_A : DRONE_B, o.x, o.y, 3);
      }
    }

    // player
    let frame;
    if (state === 'over') frame = DEAD;
    else if (state === 'ready') frame = STAND;
    else if (!pl.onGround) frame = STAND;
    else if (pl.duck) frame = legFlip ? DUCK_A : DUCK_B;
    else frame = legFlip ? RUN_A : RUN_B;
    draw(frame, pl.x, pl.by - frame.length * P);

    // HUD
    ctx.font = 'bold 16px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    const showScore = !(time < flashUntil && Math.floor(time * 8) % 2 === 0);
    ctx.fillStyle = '#8a8a84';
    ctx.fillText('HI ' + pad(hi), W - 90, 30);
    if (showScore) { ctx.fillStyle = DARK; ctx.fillText(pad(score), W - 16, 30); }
    if (muted) { ctx.textAlign = 'left'; ctx.fillStyle = '#8a8a84'; ctx.font = '12px ui-monospace, Menlo, Consolas, monospace'; ctx.fillText('Ton aus (M)', 16, 30); }

    ctx.textAlign = 'center';
    if (state === 'ready') {
      ctx.fillStyle = DARK;
      ctx.font = 'bold 28px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('ROBO-RUN', W / 2, 95);
      ctx.font = '14px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#6a6a64';
      ctx.fillText('Leertaste oder Tippen zum Starten', W / 2, 122);
    } else if (state === 'over') {
      ctx.fillStyle = DARK;
      ctx.font = 'bold 26px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillText('G A M E   O V E R', W / 2, 92);
      ctx.font = '14px ui-monospace, Menlo, Consolas, monospace';
      ctx.fillStyle = '#6a6a64';
      ctx.fillText(score >= hi && score > 0 ? 'Neuer Highscore! Nochmal?' : 'Leertaste oder Tippen für neuen Versuch', W / 2, 120);
    }
  }

  // ---------- Loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.04, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
